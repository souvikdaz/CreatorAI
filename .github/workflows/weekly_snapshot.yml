name: Weekly Audience Snapshot
    on:                                                                                                                                                                                                                                                                   
      schedule:                                                                                                                                                                                                                                                           
        # 8:00 PM IST every Sunday (14:30 UTC)                                                                                                                                                                                                                            
        - cron: '30 14 * * 0'                                                                                                                                                                                                                                             
      workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab                                                                                                                                                                                          
                                                                                                                                                                                                                                                                          
    jobs:                                                                                                                                                                                                                                                                 
      record-snapshot:                                                                                                                                                                                                                                                    
        runs-on: ubuntu-latest                                                                                                                                                                                                                                            
        permissions:                                                                                                                                                                                                                                                      
          contents: write # Grants GITHUB_TOKEN write access to commit snapshots                                                                                                                                                                                          
        steps:                                                                                                                                                                                                                                                            
          - name: Checkout Repository                                                                                                                                                                                                                                     
            uses: actions/checkout@v4                                                                                                                                                                                                                                     
                                                                                                                                                                                                                                                                          
          - name: Set up Python                                                                                                                                                                                                                                           
            uses: actions/setup-python@v5                                                                                                                                                                                                                                 
            with:                                                                                                                                                                                                                                                         
              python-version: '3.10'                                                                                                                                                                                                                                      
              cache: 'pip'                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                          
          - name: Install Dependencies                                                                                                                                                                                                                                    
            run: |                                                                                                                                                                                                                                                        
              python -m pip install --upgrade pip                                                                                                                                                                                                                         
              pip install -r requirements.txt                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                          
          - name: Run Audience Snapshot                                                                                                                                                                                                                                   
            env:                                                                                                                                                                                                                                                          
              YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}                                                                                                                                                                                                             
              INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}                                                                                                                                                                                               
              INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}                                                                                                                                                                                 
            run: |                                                                                                                                                                                                                                                        
              python run.py --snapshot                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                          
          - name: Commit and Push Updated Snapshot                                                                                                                                                                                                                        
            run: |                                                                                                                                                                                                                                                        
              git config --global user.name "github-actions[bot]"                                                                                                                                                                                                         
              git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"                                                                                                                                                                      
              git add data/audience_snapshots.json                                                                                                                                                                                                                        
              git diff --staged --quiet || (git commit -m "chore(data): record weekly audience snapshot [skip ci]" && git push)
